services:
  - type: web
    name: picard-api
    runtime: docker
    plan: free
    healthCheckPath: /api/products
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DEFAULT_URI
        value: https://picard-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: picard-db
          property: connectionString
      - key: CORS_ALLOW_ORIGIN
        sync: false
      - key: JWT_SECRET_KEY
        value: /var/www/html/config/jwt/private.pem
      - key: JWT_PUBLIC_KEY
        value: /var/www/html/config/jwt/public.pem
      - key: JWT_PASSPHRASE
        generateValue: true

databases:
  - name: picard-db
    plan: free
    databaseName: picard
    user: picard
